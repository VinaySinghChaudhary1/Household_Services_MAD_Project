{% extends 'base_dashboard.html' %}

{% block title %}
Create Service Request
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Create a New Service Request</h1>
    <form action="{{ url_for('create_service_request', service_id=service_id) }}" method="POST">
        <div class="mb-3">
            <label for="service_description" class="form-label">Service Description</label>
            <textarea class="form-control" id="service_description" name="service_description" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" class="form-control" id="price" name="price" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a href="{{ url_for('view_service_requests') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
