{% extends 'base_dashboard.html' %}

{% block title %}
Delete Service Request
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Delete Service Request</h1>
    <p>Are you sure you want to delete this service request?</p>
    <form action="{{ url_for('delete_service_request', service_request_id=service_request_id) }}" method="POST">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{{ url_for('view_service_requests') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
