{% extends 'base_dashboard.html' %}

{% block title %}
Update Service Request
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Update Service Request</h1>
    <form action="{{ url_for('update_service_request', service_request_id=service_request.service_request_id) }}" method="POST">
        <div class="mb-3">
            <label for="status" class="form-label">Update Status</label>
            <select name="status" class="form-select">
                <option value="accepted" {% if service_request.status == 'accepted' %} selected {% endif %}>Accepted</option>
                <option value="rejected" {% if service_request.status == 'rejected' %} selected {% endif %}>Rejected</option>
                <option value="completed" {% if service_request.status == 'completed' %} selected {% endif %}>Completed</option>
                <option value="returned" {% if service_request.status == 'returned' %} selected {% endif %}>Returned</option>
                <option value="cancelled" {% if service_request.status == 'cancelled' %} selected {% endif %}>Cancelled</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('view_service_requests') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
