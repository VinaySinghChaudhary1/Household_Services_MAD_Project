{% extends 'base_users.html' %}

{% block content %}

    <div class="container mt-5 d-flex justify-content-center">
        <div class="col-md-6">
            <div class="register-container bg-white p-4 rounded shadow">
                <h2 class="text-center mb-3" style="font-size: 1.5rem;">Supplier Registration</h2>
                <form id="supplierForm">
                    <!-- Full Name and Username on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="fullname" class="form-label" style="font-size: 0.9rem;">Full Name</label>
                            <input type="text" class="form-control form-control-sm" id="fullname" placeholder="Full name" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="username" class="form-label" style="font-size: 0.9rem;">Username</label>
                            <input type="text" class="form-control form-control-sm" id="username" placeholder="Username" required>
                        </div>
                    </div>

                    <!-- Email and Service Name on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="email" class="form-label" style="font-size: 0.9rem;">Email</label>
                            <input type="email" class="form-control form-control-sm" id="email" placeholder="Enter your email" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="service_name" class="form-label" style="font-size: 0.9rem;">Service Name</label>
                            <select class="form-select form-select-sm" id="service_name" required>
                                <option value="">Select a service</option>
                                <option value="ac_mobile_repair">AC Mobile Repair</option>
                                <option value="laptop_repair">Laptop Repair</option>
                                <option value="motorbike_repairs">Motorbike Repairs</option>
                                <option value="car_repairs">Car Repairs</option>
                                <option value="house_construction">House Construction</option>
                                <option value="others">Others</option>
                            </select>
                        </div>
                    </div>

                    <!-- Password and Confirm Password on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="password" class="form-label" style="font-size: 0.9rem;">Password</label>
                            <input type="password" class="form-control form-control-sm" id="password" placeholder="Enter a password" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="confirm_password" class="form-label" style="font-size: 0.9rem;">Confirm Password</label>
                            <input type="password" class="form-control form-control-sm" id="confirm_password" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <!-- Experience (Years) and Address on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="experience" class="form-label" style="font-size: 0.9rem;">Experience (Years)</label>
                            <input type="number" class="form-control form-control-sm" id="experience" placeholder="Years of experience" required min="0">
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="address" class="form-label" style="font-size: 0.9rem;">Address</label>
                            <input type="text" class="form-control form-control-sm" id="address" placeholder="Enter your address" required>
                        </div>
                    </div>

                    <!-- Role and Pin Code on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="role" class="form-label" style="font-size: 0.9rem;">Role</label>
                            <input type="text" class="form-control form-control-sm" id="role" value="Supplier" readonly>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="pincode" class="form-label" style="font-size: 0.9rem;">Pin Code</label>
                            <input type="text" class="form-control form-control-sm" id="pincode" placeholder="Enter your pin code" required>
                        </div>
                    </div>

                    <!-- Upload Document -->
                    <div class="row">
                        <div class="col-md-12 mb-2">
                            <label for="document" class="form-label" style="font-size: 0.9rem;">Upload Document</label>
                            <input type="file" class="form-control form-control-sm" id="document" required>
                        </div>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn register-btn w-100 btn-primary btn-sm mt-3">Register</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript for form validation -->
    <script>
        document.getElementById('supplierForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            let fullname = document.getElementById('fullname').value;
            let username = document.getElementById('username').value;
            let email = document.getElementById('email').value;
            let service_name = document.getElementById('service_name').value;
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirm_password').value;
            let experience = document.getElementById('experience').value;
            let address = document.getElementById('address').value;
            let pincode = document.getElementById('pincode').value;
            let documentFile = document.getElementById('document').files[0];

            // Perform simple validation
            if (!fullname || !username || !email || !service_name || !password || !confirmPassword || !experience || !address || !pincode || !documentFile) {
                alert("All fields are required!");
            } else if (password !== confirmPassword) {
                alert("Passwords do not match!");
            } else {
                alert("Registration successful!");
            }
        });
    </script>

{% endblock %}
