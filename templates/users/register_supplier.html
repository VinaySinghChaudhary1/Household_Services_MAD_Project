{% extends 'base_users.html' %}

{% block title %}
Supplier Registration
{% endblock %}


{% block content %}

    <div class="container mt-5 d-flex justify-content-center">
        <div class="col-md-6">
            <div class="register-container bg-white p-4 rounded shadow">
                <h2 class="text-center mb-3" style="font-size: 1.5rem;">Supplier Registration</h2>
                <form id="supplierForm" action="{{ url_for('register_supplier') }}" method="POST" enctype="multipart/form-data">
                    
                    <!-- Full Name and Username on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="fullname" class="form-label" style="font-size: 0.9rem;">Full Name</label>
                            <input type="text" class="form-control form-control-sm" id="fullname" name="fullname" placeholder="Full name" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="username" class="form-label" style="font-size: 0.9rem;">Username</label>
                            <input type="text" class="form-control form-control-sm" id="username" name="username" placeholder="Username" required>
                        </div>
                    </div>

                    <!-- Email and Service Name(Category Name) on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="email" class="form-label" style="font-size: 0.9rem;">Email</label>
                            <input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="Enter your email" required>
                        </div>
    
                        <div class="col-md-6 mb-2">
                            <label for="service_name" class="form-label" style="font-size: 0.9rem;">Service Name</label>
                            <select class="form-control form-control-sm" id="service_name" name="service_name">
                                <option value="">Select a Service</option>
                                {% for category in categories %}
                                    <option value="{{ category.category_name }}">{{ category.category_name }}</option>
                                {% endfor %}
                            </select>
                            <small class="form-text text-muted">Choose from the list or type a new service below if not found.</small>
                        </div>
                    </div>

                    <!-- Additional Service Name input -->
                    <div class="mb-2">
                        <label for="new_service_name" class="form-label" style="font-size: 0.9rem;">Or Type New Service Name</label>
                        <input type="text" class="form-control form-control-sm" id="new_service_name" name="new_service_name" placeholder="Enter a new service name if not listed">
                    </div>

                    <!-- Password and Confirm Password on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="password" class="form-label" style="font-size: 0.9rem;">Password</label>
                            <input type="password" class="form-control form-control-sm" id="password" name="password" placeholder="Enter a password" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="confirm_password" class="form-label" style="font-size: 0.9rem;">Confirm Password</label>
                            <input type="password" class="form-control form-control-sm" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <!-- Experience (Years) and Address on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="experience" class="form-label" style="font-size: 0.9rem;">Experience (Years)</label>
                            <input type="number" class="form-control form-control-sm" id="experience" name="experience" placeholder="Years of experience" required min="0">
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="address" class="form-label" style="font-size: 0.9rem;">Address</label>
                            <input type="text" class="form-control form-control-sm" id="address" name="address" placeholder="Enter your address" required>
                        </div>
                    </div>

                    <!-- Role and Pin Code on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="role" class="form-label" style="font-size: 0.9rem;">Role</label>
                            <input type="text" class="form-control form-control-sm" id="role" name="role" value="Supplier" readonly>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="pincode" class="form-label" style="font-size: 0.9rem;">Pin Code</label>
                            <input type="text" class="form-control form-control-sm" id="pincode" name="pincode" placeholder="Enter your pin code" required>
                        </div>
                    </div>

                    <!-- Upload Document -->
                    <div class="row">
                        <div class="col-md-12 mb-2">
                            <label for="document" class="form-label" style="font-size: 0.9rem;">Upload Document</label>
                            <input type="file" class="form-control form-control-sm" id="document" name="document" required>
                        </div>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn register-btn w-100 btn-primary btn-sm mt-3">Register</button>
                </form>
            </div>
        </div>
    </div>


    
<!-- JavaScript to handle enabling/disabling of fields -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const serviceNameSelect = document.getElementById("service_name");
        const newServiceNameInput = document.getElementById("new_service_name");

        // Disable the other input when one is filled
        serviceNameSelect.addEventListener("change", function () {
            if (serviceNameSelect.value !== "") {
                newServiceNameInput.disabled = true;
            } else {
                newServiceNameInput.disabled = false;
            }
        });

        newServiceNameInput.addEventListener("input", function () {
            if (newServiceNameInput.value.trim() !== "") {
                serviceNameSelect.disabled = true;
            } else {
                serviceNameSelect.disabled = false;
            }
        });
    });
</script>


{% endblock %}
