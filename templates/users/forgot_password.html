{% extends 'base_users.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="forgot-password-container p-5 rounded shadow" style="background-color: #ffeb3b;">
                <h2 class="text-center mb-4">Forgot Password</h2>
                <form id="forgotPasswordForm" action="{{ url_for('forgot_password') }}" method="POST">
                    <!-- Username Field -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                    </div>

                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <button type="submit" class="btn w-100 btn-primary">Check</button>
                </form>

                <!-- New Password Field (Initially Hidden) -->
                <div id="newPasswordSection" style="display: none;">
                    <form id="setNewPasswordForm" action="{{ url_for('set_new_password') }}" method="POST">
                        <input type="hidden" name="username" id="hiddenUsername">
                        <input type="hidden" name="email" id="hiddenEmail">

                        <!-- New Password Field -->
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password" required>
                        </div>

                        <button type="submit" class="btn w-100 btn-success">Set New Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Show the new password section after successful validation
    document.addEventListener('DOMContentLoaded', () => {
        const queryParams = new URLSearchParams(window.location.search);
        if (queryParams.get('valid') === 'true') {
            const username = queryParams.get('username');
            const email = queryParams.get('email');

            document.getElementById('newPasswordSection').style.display = 'block';
            document.getElementById('hiddenUsername').value = username;
            document.getElementById('hiddenEmail').value = email;

            // Hide the initial form
            document.getElementById('forgotPasswordForm').style.display = 'none';
        }
    });
</script>

{% endblock %}
