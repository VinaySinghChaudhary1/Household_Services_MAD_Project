{% extends "base_users.html" %}

{% block title %}
Logout Confirmation
{% endblock %}

{% block content %}

<div class="container-fluid mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="p-4 rounded shadow bg-light text-center">
                <h1 class="mb-4">Are you sure you want to logout?</h1>
                <div class="d-flex justify-content-center">
                    <form action="{{ url_for('logout') }}" method="POST" class="mx-2">
                        <button type="submit" class="btn btn-danger">Yes, Logout</button>
                    </form>
                    <a href="{{ url_for('home') }}" class="btn btn-secondary mx-2">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
