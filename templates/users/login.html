{% extends 'base_users.html' %}

{% block title %}
login page
{% endblock %}

{% block content %}

    <div class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Login container with yellow background -->
                <div class="login-container p-5 rounded shadow" style="background-color: #ffeb3b;">
                    <h2 class="text-center mb-4">Login</h2>
                    <form id="loginForm" action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="">Select your role</option>
                                <option value="admin">Admin</option>
                                <option value="customer">Customer</option>
                                <option value="supplier">Supplier</option>
                            </select>
                        </div>

                        <button type="submit" class="btn login-btn w-100 btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript for form validation -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let email = document.getElementById('email').value;
            let role = document.getElementById('role').value;

            // Perform simple validation
            if (!username || !password || !email || !role) {
                alert("All fields are required!");
            } else {
                // Proceed with form submission
                event.target.submit();
            }
        });
    </script>

{% endblock %}
