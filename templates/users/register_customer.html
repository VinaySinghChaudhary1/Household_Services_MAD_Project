{% extends 'base_users.html' %}

{% block title %}
Customer Registration
{% endblock %}

{% block content %}

<div class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="register-container bg-white p-4 rounded shadow">
                <h2 class="text-center mb-3" style="font-size: 1.5rem;">Customer Registration</h2>
                <form id="registerForm" action="{{ url_for('register_customer') }}" method="POST" enctype="multipart/form-data">
                    <!-- Full Name and Username on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="fullname" class="form-label" style="font-size: 0.9rem;">Full Name</label>
                            <input type="text" class="form-control form-control-sm" id="fullname" name="fullname" placeholder="Enter your full name" autocomplete="name" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="username" class="form-label" style="font-size: 0.9rem;">Username</label>
                            <input type="text" class="form-control form-control-sm" id="username" name="username" placeholder="Enter a username" autocomplete="username" required>
                        </div>
                    </div>

                    <!-- Address and Email on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="address" class="form-label" style="font-size: 0.9rem;">Address</label>
                            <input type="text" class="form-control form-control-sm" id="address" name="address" placeholder="Enter your address" autocomplete="street-address" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="email" class="form-label" style="font-size: 0.9rem;">Email</label>
                            <input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                        </div>
                    </div>

                    <!-- Password and Confirm Password on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="password" class="form-label" style="font-size: 0.9rem;">Password</label>
                            <input type="password" class="form-control form-control-sm" id="password" name="password" placeholder="Enter a password" autocomplete="new-password" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="confirm_password" class="form-label" style="font-size: 0.9rem;">Confirm Password</label>
                            <input type="password" class="form-control form-control-sm" id="confirm_password" name="confirm_password" placeholder="Confirm your password" autocomplete="new-password" required>
                        </div>
                    </div>

                    <!-- Pin Code and Role on the same row -->
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label for="pincode" class="form-label" style="font-size: 0.9rem;">Pin Code</label>
                            <input type="text" class="form-control form-control-sm" id="pincode" name="pincode" placeholder="Enter your pin code" autocomplete="postal-code" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label for="role" class="form-label" style="font-size: 0.9rem;">Role</label>
                            <input type="text" class="form-control form-control-sm" id="role" name="role" value="Customer" readonly autocomplete="off">
                        </div>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn register-btn w-100 btn-primary btn-sm mt-3">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Floating Signup Card -->
<div class="floating-signup-card">
    <h5>Supplier Sign Up</h5>
    <a href="/register_supplier" class="btn btn-outline-secondary w-100">Supplier Registration</a>
</div>

{% endblock %}
