{% extends 'base.html' %}

{% block content %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="register-container bg-white p-5 rounded shadow">
                    <h2 class="text-center mb-4">Customer Registration</h2>
                    <form id="registerForm">
                        <!-- Full Name and Username on the same row -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fullname" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Enter your full name" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Enter a username" required>
                            </div>
                        </div>

                        <!-- Address and Email on the same row -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <!-- Password and Confirm Password on the same row -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter a password" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" placeholder="Confirm your password" required>
                            </div>
                        </div>

                        <!-- Pin Code and Role on the same row -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="pincode" class="form-label">Pin Code</label>
                                <input type="text" class="form-control" id="pincode" placeholder="Enter your pin code" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" required>
                                    <option value="">Select your role</option>
                                    <option value="customer">Customer</option>
                                    <option value="supplier">Supplier</option>
                                </select>
                            </div>
                        </div>

                        <!-- Register Button -->
                        <button type="submit" class="btn register-btn w-100 btn-primary">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript for form validation -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            let fullname = document.getElementById('fullname').value;
            let username = document.getElementById('username').value;
            let email = document.getElementById('email').value;
            let address = document.getElementById('address').value;
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirm_password').value;
            let role = document.getElementById('role').value;
            let pincode = document.getElementById('pincode').value;

            // Perform simple validation
            if (!fullname || !username || !email || !address || !password || !confirmPassword || !role || !pincode) {
                alert("All fields are required!");
            } else if (password !== confirmPassword) {
                alert("Passwords do not match!");
            } else {
                alert("Registration successful!");
            }
        });
    </script>

{% endblock %}
