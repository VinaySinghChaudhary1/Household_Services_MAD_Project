{% extends 'base_dashboard.html' %}

{% block title %}
Edit Category
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Edit Category</h1>
    <form action="{{ url_for('edit_category', category_id=category.category_id) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="category_name" class="form-label">Category Name</label>
            <input type="text" class="form-control" id="category_name" name="category_name" value="{{ category.category_name }}" required>
        </div>
        <div class="mb-3">
            <label for="category_description" class="form-label">Category Description</label>
            <textarea class="form-control" id="category_description" name="category_description" rows="3" required>{{ category.category_description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="picture" class="form-label">Change Picture (optional)</label>
            <input type="file" class="form-control" id="picture" name="picture" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Update Category</button>
    </form>
</div>
{% endblock %}
