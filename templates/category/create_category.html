{% extends 'base_dashboard.html' %}

{% block title %}
Create Category
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Create New Category</h1>
    <form action="{{ url_for('create_category') }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="category_name" class="form-label">Category Name</label>
            <input type="text" class="form-control" id="category_name" name="category_name" required>
        </div>
        <div class="mb-3">
            <label for="category_description" class="form-label">Category Description</label>
            <textarea class="form-control" id="category_description" name="category_description" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="picture" class="form-label">Category Picture</label>
            <input type="file" class="form-control" id="picture" name="picture" accept="image/*">
        </div>
        <div class="mb-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Category</button>
            <a href="{{ url_for('category_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
