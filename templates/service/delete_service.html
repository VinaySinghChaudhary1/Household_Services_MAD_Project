{% extends 'base_dashboard.html' %}

{% block title %}
Delete Service
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Delete Service</h1>
    <p>Are you sure you want to delete the service: <strong>{{ service.service_name }}</strong>?</p>
    <p>This action cannot be undone.</p>

    <form action="{{ url_for('delete_service', service_id=service.service_id) }}" method="POST">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{{ url_for('service_dashboard', category_id=service.category_id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
