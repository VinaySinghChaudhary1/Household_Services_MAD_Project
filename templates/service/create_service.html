{% extends 'base_dashboard.html' %}

{% block title %}
Create Service
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Create a New Service</h1>
    <form action="{{ url_for('create_service', category_id=category_id) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="service_name" class="form-label">Service Name</label>
            <input type="text" class="form-control" id="service_name" name="service_name" required>
        </div>
        <div class="mb-3">
            <label for="service_description" class="form-label">Service Description</label>
            <textarea class="form-control" id="service_description" name="service_description" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" class="form-control" id="price" name="price" required>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Service Image</label>
            <input type="file" class="form-control" id="image" name="image">
        </div>
        <div class="mb-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Service</button>
            <a href="{{ url_for('service_dashboard', category_id=category_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
