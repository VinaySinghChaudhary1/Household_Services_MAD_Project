{% extends 'base_dashboard.html' %}

{% block title %}Review{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Leave a Review for {{ service_request.service.service_name }}</h1>

    <form action="{{ url_for('leave_review', service_request_id=service_request.service_request_id) }}" method="POST">
        <div class="mb-3">
            <label for="rating" class="form-label">Rating (1 to 5)</label>
            <select class="form-select" id="rating" name="rating" required>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="comment" class="form-label">Comment (optional)</label>
            <textarea class="form-control" id="comment" name="comment" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit Review</button>
        <a href="{{ url_for('customer_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
